name: xroad-apis-only

services:
  system-a-portal:
    build:
      context: ./system-a-portal
      dockerfile: Dockerfile.apis-only
    environment:
      PORT: 3000
      XROAD_BASE_URL: ${PORTAL_XROAD_BASE_URL:-}
      XROAD_CLIENT: ${PORTAL_XROAD_CLIENT:-BJ/GOV/PORTAL/CONCOURS}

  system-b-anip:
    build:
      context: ./system-b-anip
      dockerfile: Dockerfile.apis-only
    environment:
      PORT: 3001
      HTTP_ONLY: "true"
      TRUST_XROAD: "true"
      LOG_DISABLED: "true"

  system-c-justice:
    build:
      context: ./system-c-justice
      dockerfile: Dockerfile.apis-only
    environment:
      PORT: 3002
      HTTP_ONLY: "true"
      TRUST_XROAD: "true"
      LOG_DISABLED: "true"

  system-d-dges:
    build:
      context: ./system-d-dges
      dockerfile: Dockerfile.apis-only
    environment:
      PORT: 3003
      HTTP_ONLY: "true"
      TRUST_XROAD: "true"
      LOG_DISABLED: "true"

  apis-nginx:
    image: nginx:1.27-alpine
    ports:
      - "38000:38000"
    volumes:
      - ./nginx/apis-only.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - system-a-portal
      - system-b-anip
      - system-c-justice
      - system-d-dges

  frontend-nginx:
    image: nginx:1.27-alpine
    ports:
      - "38080:38080"
    volumes:
      - ./nginx/frontend-portal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - system-a-portal
      - apis-nginx
