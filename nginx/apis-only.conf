server {
    listen 38000;
    server_name _;

    client_max_body_size 10m;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"gateway":"apis-only","services":["anip","justice","dges"]}';
    }

    location = /anip {
        return 308 /anip/;
    }

    location /anip/ {
        proxy_pass http://system-b-anip:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Road-Client $http_x_road_client;
        proxy_set_header X-Road-Id $http_x_road_id;
        proxy_set_header X-Road-Request-Id $http_x_road_request_id;
    }

    location = /justice {
        return 308 /justice/;
    }

    location /justice/ {
        proxy_pass http://system-c-justice:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Road-Client $http_x_road_client;
        proxy_set_header X-Road-Id $http_x_road_id;
        proxy_set_header X-Road-Request-Id $http_x_road_request_id;
    }

    location = /dges {
        return 308 /dges/;
    }

    location /dges/ {
        proxy_pass http://system-d-dges:3003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Road-Client $http_x_road_client;
        proxy_set_header X-Road-Id $http_x_road_id;
        proxy_set_header X-Road-Request-Id $http_x_road_request_id;
    }
}
