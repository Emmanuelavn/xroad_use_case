server {
    listen 38000;
    server_name cra-case.asin.bj _;

    client_max_body_size 10m;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location = /api/health {
        default_type application/json;
        return 200 '{"ok":true,"gateway":"apis-only","services":["portal","anip","justice","dges"]}';
    }

    location = /api/portal {
        return 308 /api/portal/;
    }

    location /api/portal/ {
        proxy_pass https://system-a-portal:3000/;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Road-Client $http_x_road_client;
        proxy_set_header X-Road-Id $http_x_road_id;
        proxy_set_header X-Road-Request-Id $http_x_road_request_id;
    }

    location = /api/anip {
        return 308 /api/anip/;
    }

    location /api/anip/ {
        proxy_pass http://system-b-anip:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Road-Client $http_x_road_client;
        proxy_set_header X-Road-Id $http_x_road_id;
        proxy_set_header X-Road-Request-Id $http_x_road_request_id;
    }

    location = /api/justice {
        return 308 /api/justice/;
    }

    location /api/justice/ {
        proxy_pass http://system-c-justice:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Road-Client $http_x_road_client;
        proxy_set_header X-Road-Id $http_x_road_id;
        proxy_set_header X-Road-Request-Id $http_x_road_request_id;
    }

    location = /api/dges {
        return 308 /api/dges/;
    }

    location /api/dges/ {
        proxy_pass http://system-d-dges:3003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Road-Client $http_x_road_client;
        proxy_set_header X-Road-Id $http_x_road_id;
        proxy_set_header X-Road-Request-Id $http_x_road_request_id;
    }
}
