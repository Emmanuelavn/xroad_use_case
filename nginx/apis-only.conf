resolver 127.0.0.11 valid=10s ipv6=off;

upstream portal_backend {
    zone portal_backend 64k;
    server system-a-portal:3000 resolve;
}

upstream anip_backend {
    zone anip_backend 64k;
    server system-b-anip:3001 resolve;
}

upstream justice_backend {
    zone justice_backend 64k;
    server system-c-justice:3002 resolve;
}

upstream dges_backend {
    zone dges_backend 64k;
    server system-d-dges:3003 resolve;
}
server {
    listen 38000;
    server_name cra-case.asin.bj _;

    client_max_body_size 10m;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location = /api/health {
        default_type application/json;
        return 200 '{"ok":true,"gateway":"apis-only","services":["portal","anip","justice","dges"]}';
    }

    location = /api/portal {
        return 308 /api/portal/;
    }

    location /api/portal/ {
        proxy_pass https://portal_backend/;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Road-Client $http_x_road_client;
        proxy_set_header X-Road-Id $http_x_road_id;
        proxy_set_header X-Road-Request-Id $http_x_road_request_id;
        proxy_set_header Uxp-Client $http_uxp_client;
        proxy_set_header Uxp-Service $http_uxp_service;
        proxy_set_header Uxp-Queryid $http_uxp_queryid;
    }

    location = /api/anip {
        return 308 /api/anip/;
    }

    location /api/anip/ {
        proxy_pass http://anip_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Road-Client $http_x_road_client;
        proxy_set_header X-Road-Id $http_x_road_id;
        proxy_set_header X-Road-Request-Id $http_x_road_request_id;
        proxy_set_header Uxp-Client $http_uxp_client;
        proxy_set_header Uxp-Service $http_uxp_service;
        proxy_set_header Uxp-Queryid $http_uxp_queryid;
    }

    location = /api/justice {
        return 308 /api/justice/;
    }

    location /api/justice/ {
        proxy_pass http://justice_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Road-Client $http_x_road_client;
        proxy_set_header X-Road-Id $http_x_road_id;
        proxy_set_header X-Road-Request-Id $http_x_road_request_id;
        proxy_set_header Uxp-Client $http_uxp_client;
        proxy_set_header Uxp-Service $http_uxp_service;
        proxy_set_header Uxp-Queryid $http_uxp_queryid;
    }

    location = /api/dges {
        return 308 /api/dges/;
    }

    location /api/dges/ {
        proxy_pass http://dges_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Road-Client $http_x_road_client;
        proxy_set_header X-Road-Id $http_x_road_id;
        proxy_set_header X-Road-Request-Id $http_x_road_request_id;
        proxy_set_header Uxp-Client $http_uxp_client;
        proxy_set_header Uxp-Service $http_uxp_service;
        proxy_set_header Uxp-Queryid $http_uxp_queryid;
    }

    location /api/ {
        proxy_pass https://portal_backend/api/;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
