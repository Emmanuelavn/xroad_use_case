server {
    listen 38080;
    server_name cra-case.asin.bj _;

    client_max_body_size 10m;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"gateway":"frontend","service":"portal"}';
    }

    location /api/anip/ {
        proxy_pass http://apis-nginx:38000/api/anip/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Road-Client $http_x_road_client;
        proxy_set_header X-Road-Id $http_x_road_id;
        proxy_set_header X-Road-Request-Id $http_x_road_request_id;
    }

    location /api/justice/ {
        proxy_pass http://apis-nginx:38000/api/justice/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Road-Client $http_x_road_client;
        proxy_set_header X-Road-Id $http_x_road_id;
        proxy_set_header X-Road-Request-Id $http_x_road_request_id;
    }

    location /api/dges/ {
        proxy_pass http://apis-nginx:38000/api/dges/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Road-Client $http_x_road_client;
        proxy_set_header X-Road-Id $http_x_road_id;
        proxy_set_header X-Road-Request-Id $http_x_road_request_id;
    }

    location /api/portal/ {
        proxy_pass http://apis-nginx:38000/api/portal/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Road-Client $http_x_road_client;
        proxy_set_header X-Road-Id $http_x_road_id;
        proxy_set_header X-Road-Request-Id $http_x_road_request_id;
    }

    location /api/ {
        proxy_pass https://system-a-portal:3000/api/;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass https://system-a-portal:3000/;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
